<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Фотомозаика — Deep Zoom</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- Loading Screen for slow connections -->
  <div id="loading-screen" class="loading-screen" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="loading-content">
      <div id="loading-text" class="loading-text">Загрузка фотомозаики...</div>
      <div class="loading-bar-track">
        <div id="loading-bar-fill" class="loading-bar-fill"></div>
      </div>
      <div id="loading-percent" class="loading-percent">0%</div>
    </div>
  </div>

  <!-- OpenSeadragon Main Viewport -->
  <div id="openseadragon-view"></div>

  <!-- Header Bar -->
  <header class="top-bar">
    <div class="brand">
      <span id="brand-stats" class="brand-stats">...</span>
    </div>
  </header>

  <!-- Minimap / Navigator Container -->
  <div id="navigator-wrapper" class="navigator-wrapper">
    <div id="navigator-view"></div>
  </div>

  <!-- Inspector Card for Clicked Photo -->
  <aside id="inspector-card" class="inspector-card" aria-label="Детали фото">
    <div class="inspector-header">
      <span id="inspector-title" class="inspector-title">Фрагмент</span>
      <button id="inspector-close" class="inspector-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
    <div class="inspector-image-wrap">
      <img id="inspector-img" src="" alt="Детали фото">
    </div>
    <div class="inspector-body">
      <div id="inspector-filename" class="inspector-filename"></div>
      <div id="inspector-pos" class="inspector-pos"></div>
    </div>
  </aside>

  <!-- Interaction Hint -->
  <div id="interaction-hint" class="interaction-hint">
    Приближайте колесом мыши или жестом • Кликните на фото для просмотра
  </div>

  <!-- HUD Control Panel -->
  <nav class="hud-controls" aria-label="Управление масштабом">
    <button id="btn-zoom-in" class="hud-btn" title="Приблизить" aria-label="Приблизить">
      <svg viewBox="0 0 24 24">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
    </button>
    <button id="btn-zoom-out" class="hud-btn" title="Отдалить" aria-label="Отдалить">
      <svg viewBox="0 0 24 24">
        <path d="M19 13H5v-2h14v2z"/>
      </svg>
    </button>
    <div class="hud-divider"></div>
    <button id="btn-home" class="hud-btn" title="Исходный масштаб" aria-label="Исходный масштаб">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </button>
    <button id="btn-minimap" class="hud-btn" title="Карта навигации" aria-label="Переключить карту навигации">
      <svg viewBox="0 0 24 24">
        <path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/>
      </svg>
    </button>
  </nav>

  <script src="assets/openseadragon/openseadragon.min.js"></script>
  <script src="metadata/mosaic_info.js"></script>
  <script src="assets/viewer.js"></script>
</body>
</html>
